<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Historical Data - Hexapod</title>
  <link rel="stylesheet" href="style.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>

<body>

<nav class="navbar">
  <div class="logo">Hexapod-Cloud</div>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="dashboard.html">Live Dashboard</a></li>
    <li><a href="history.html" class="active">History</a></li>
    <li><a href="architecture.html">Architecture</a></li>
    <li><a href="research.html">Research</a></li>
    <li><a href="team.html">Team</a></li>
  </ul>
</nav>

<section class="dashboard-section">

  <h1>Historical Monitoring Data</h1>

  <div style="margin:20px 0;">
    <button onclick="exportCSV()" class="btn">Download CSV</button>
    <button onclick="generateReport()" class="btn">Generate Report</button>
  </div>

  <canvas id="historyChart"></canvas>

  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>CO Level</th>
        <th>Air Quality</th>
      </tr>
    </thead>
    <tbody id="historyTable"></tbody>
  </table>

</section>

<script>

// ===== FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyCehgDLT0amLHXWi1hBSSJzvBQ7R2Nhmg",
  databaseURL: "https://hexapod-monitoring-system-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hexapod-monitoring-system"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// ===== CHART =====
const ctx = document.getElementById("historyChart").getContext("2d");

const historyChart = new Chart(ctx, {
  type: "line",
  data: {
    labels: [],
    datasets: [
      {
        label: "CO Level",
        data: [],
        borderColor: "#0ea5e9",
        borderWidth: 2
      },
      {
        label: "Air Quality",
        data: [],
        borderColor: "#ef4444",
        borderWidth: 2
      }
    ]
  }
});

const tableBody = document.getElementById("historyTable");
let maxRows = 50;

// ===== REALTIME LISTENER =====
database.ref("hexapod").on("value", (snapshot) => {

  const data = snapshot.val();

  if(data){

    const currentTime = new Date().toLocaleTimeString();

    // Chart update
    if(historyChart.data.labels.length > maxRows){
      historyChart.data.labels.shift();
      historyChart.data.datasets[0].data.shift();
      historyChart.data.datasets[1].data.shift();
    }

    historyChart.data.labels.push(currentTime);
    historyChart.data.datasets[0].data.push(data.co);
    historyChart.data.datasets[1].data.push(data.air);
    historyChart.update();

    // Table update
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${currentTime}</td>
      <td>${data.co}</td>
      <td>${data.air}</td>
    `;

    if(tableBody.rows.length >= maxRows){
      tableBody.deleteRow(0);
    }

    tableBody.appendChild(row);
  }
});


// ===== CSV DOWNLOAD =====
function exportCSV() {

  let csv = "Time,CO Level,Air Quality\n";
  const rows = document.querySelectorAll("#historyTable tr");

  rows.forEach(row => {
    const cols = row.querySelectorAll("td");
    const rowData = [];
    cols.forEach(col => rowData.push(col.innerText));
    csv += rowData.join(",") + "\n";
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "hexapod_history.csv";
  a.click();

  URL.revokeObjectURL(url);
}


// ===== REPORT DOWNLOAD (NO POPUP BLOCK) =====
function generateReport() {

  const table = document.getElementById("historyTable");

  if (!table || table.rows.length === 0) {
    alert("No data available to generate report.");
    return;
  }

  let htmlContent = `
  <html>
  <head>
    <title>Hexapod Monitoring Report</title>
    <style>
      body { font-family: Arial; padding:20px; }
      h2 { text-align:center; }
      table { width:100%; border-collapse: collapse; margin-top:20px; }
      th, td { border:1px solid #000; padding:8px; text-align:center; }
      th { background:#f2f2f2; }
    </style>
  </head>
  <body>
    <h2>Hexapod Monitoring Report</h2>
    <p><strong>Generated:</strong> ${new Date().toLocaleString()}</p>
    <table>
      <tr>
        <th>Time</th>
        <th>CO Level</th>
        <th>Air Quality</th>
      </tr>
  `;

  for (let i = 0; i < table.rows.length; i++) {
    htmlContent += "<tr>" + table.rows[i].innerHTML + "</tr>";
  }

  htmlContent += `
    </table>
  </body>
  </html>
  `;

  const blob = new Blob([htmlContent], { type: "text/html" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "hexapod_report.html";
  a.click();

  URL.revokeObjectURL(url);
}

</script>

</body>
</html>
